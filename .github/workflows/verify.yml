# Linux verification: unit tests, bundled-engine checksums and an offline replay of the public
# scoring models (no engine, no network), so a change that alters a published model is caught.
name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:engines
      - run: node tools/calibration/reproduce-public.mjs
