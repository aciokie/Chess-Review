name: Update validation dataset

# Keeps the Lichess CC0 validation sample fresh on a ~30-day cadence. GitHub cron cannot express
# exactly 30 days, so this runs on the 1st of each month; the updater itself compares the newest
# published month against the committed lock and no-ops when nothing changed.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh the validation sample when a newer Lichess month exists
        run: node tools/calibration/update-dataset.mjs
      - name: Commit the refreshed provenance lock
        run: |
          if [ -n "$(git status --porcelain -- tools/calibration/dataset-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/calibration/dataset-lock.json
            git commit -m "Update Lichess validation dataset lock"
            git push
          else
            echo "Validation dataset already up to date"
          fi
