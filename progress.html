<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Review — Progress</title>
    <link rel="icon" type="image/png" sizes="128x128" href="icons/icon128.png" />
    <style>
      /* =====================================================================================
         Chess Review — Progress page.

         Visual system adapted from Linear's dark canvas (a five-step surface ladder carried by
         hairlines, one chromatic accent used sparingly, hierarchy from size and weight rather than
         colour) with the composition of a professional analytics dashboard: a sticky filter bar,
         KPI cards made of label + hero number + delta chip + sparkline, a composition donut, and
         section frames. Data colours follow chess.com's move-quality palette and appear only where
         the data is categorical.

         Still a standalone, engine-free page: it only reads the saved Library.
         ===================================================================================== */

      /* ---------- 1. tokens ---------- */
      :root {
        --font-ui: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        /* Canvas and the surface ladder (Linear). */
        --bg: #010102; --bg-grain: #08090a;
        --panel: #0f1011; --panel-2: #141516; --panel-3: #191a1b; --panel-4: #1d1f21;

        /* Hairlines carry the hierarchy. */
        --line: #23252a; --line-soft: #1b1d21; --line-strong: #34343a;

        /* Ink steps. */
        --ink: #f7f8f8; --ink-2: #d0d6e0; --ink-3: #8a8f98; --ink-4: #62666d;

        /* One accent, used scarcely. */
        --accent: #7fb45f; --accent-strong: #6aa14a; --accent-ink: #08130a;
        --accent-glow: color-mix(in oklab, var(--accent) 22%, transparent);
        --loss: #ef7a70; --draw: #8a8f98;

        /* Move-quality palette (chess.com) — only for categorical data. */
        --dq-brilliant: #26c2a3; --dq-great: #749bbf; --dq-best: #81b64c; --dq-excellent: #96bc4b;
        --dq-good: #95b776; --dq-book: #a88865; --dq-forced: #8d9a86;
        --dq-inacc: #f7c631; --dq-mistake: #ffa459; --dq-miss: #ff7769; --dq-blunder: #fa412d;

        --radius: 14px; --radius-sm: 10px; --radius-lg: 20px;
        --ease: cubic-bezier(.22, .61, .36, 1);
        --dur: 220ms;

        --shadow-1: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 40px -32px rgba(0, 0, 0, .95);
        --shadow-2: 0 30px 70px -45px rgba(0, 0, 0, 1);
        --ring: 0 0 0 3px color-mix(in oklab, var(--accent) 32%, transparent);
      }

      /* ---------- 2. base ---------- */
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--font-ui); font-size: 14px; line-height: 1.5; color: var(--ink);
        min-height: 100vh; -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(900px 420px at 50% -12%, color-mix(in oklab, var(--accent) 7%, transparent), transparent 70%),
          linear-gradient(var(--bg), var(--bg));
        background-attachment: fixed;
      }
      ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }
      :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }
      a { color: var(--ink-2); text-decoration: none; }
      h3 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.2px; }
      /* A thin, quiet scrollbar matches the surfaces instead of the OS chrome. */
      * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
      *::-webkit-scrollbar-track { background: transparent; }

      /* ---------- 3. top bar ---------- */
      .top {
        position: sticky; top: 0; z-index: 40;
        background: color-mix(in oklab, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px) saturate(140%);
        border-bottom: 1px solid var(--line-soft);
      }
      .top-in { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark {
        width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
        background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 90%, #fff 4%), var(--accent-strong));
        box-shadow: 0 0 0 1px var(--line-strong), 0 8px 22px -14px var(--accent);
      }
      .brand-mark img { width: 21px; height: 21px; display: block; }
      .brand-name { font-weight: 700; letter-spacing: .16em; font-size: 12.5px; text-transform: uppercase; }
      .brand-name span { color: var(--ink-4); font-weight: 600; }

      /* Tabs read as one segmented control: a track with a raised active pill. */
      .tabs { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 999px;
        background: var(--panel-2); border: 1px solid var(--line-soft); }
      .tab {
        font: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: -.1px; cursor: pointer;
        padding: 7px 16px; border: 0; border-radius: 999px; color: var(--ink-3); background: transparent;
        transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      }
      .tab:hover { color: var(--ink-2); }
      .tab[aria-pressed="true"] {
        color: var(--ink); background: var(--panel-4);
        box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 6px 16px -12px rgba(0, 0, 0, 1);
      }

      /* ---------- 4. page frame + jump rail ---------- */
      .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 24px 80px; display: grid; gap: 18px;
        grid-template-columns: minmax(0, 1fr) 168px; align-items: start; }
      .wrap > .main { min-width: 0; }
      .jump { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 2px;
        border-left: 1px solid var(--line-soft); padding: 4px 0 4px 14px; }
      .jump[hidden] { display: none; }   /* author display rules would otherwise beat [hidden] */
      .jump-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4);
        font-weight: 700; margin-bottom: 6px; }
      .jump a { font-size: 12px; color: var(--ink-4); padding: 3px 0; display: flex; align-items: center; gap: 7px;
        transition: color var(--dur) var(--ease); }
      .jump a::before { content: ""; width: 4px; height: 4px; border-radius: 999px; background: var(--line-strong);
        transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
      .jump a:hover { color: var(--ink-2); }
      .jump a:hover::before { background: var(--ink-4); transform: scale(1.4); }
      .jump a.on { color: var(--accent); }
      .jump a.on::before { background: var(--accent); transform: scale(1.4); }

      /* ---------- 5. toolbar (the filter bar) ---------- */
      .toolbar {
        position: sticky; top: 57px; z-index: 30; display: grid; gap: 10px;
        margin: -6px -8px 0; padding: 12px 8px 12px;
        background: color-mix(in oklab, var(--bg) 88%, transparent);
        backdrop-filter: blur(12px) saturate(140%);
        border-bottom: 1px solid var(--line-soft);
      }
      .tracking { margin: 0; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .tracking b { color: var(--ink); font-weight: 600; }
      .tracking::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow); }
      .tracking.warn::before { background: var(--dq-inacc); box-shadow: 0 0 0 3px color-mix(in oklab, var(--dq-inacc) 25%, transparent); }

      .controls { display: grid; gap: 8px; }
      .chip-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .chip-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4);
        font-weight: 700; min-width: 62px; }
      .chip {
        font: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; cursor: pointer;
        color: var(--ink-3); background: var(--panel); border: 1px solid var(--line-soft);
        transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background-color var(--dur) var(--ease), transform 120ms var(--ease);
      }
      .chip:hover { color: var(--ink); border-color: var(--line-strong); background: var(--panel-2); }
      .chip:active { transform: scale(.97); }
      .chip.on {
        color: var(--accent-ink); background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 92%, #fff 3%), var(--accent-strong));
        border-color: transparent; box-shadow: 0 8px 20px -14px var(--accent);
      }
      .chip.reset { color: var(--ink-3); border-style: dashed; }

      /* ---------- 6. section frames ---------- */
      .sec { display: grid; gap: 12px; scroll-margin-top: 130px; }
      .sec-head { display: flex; align-items: baseline; gap: 10px; }
      .eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); font-weight: 700; }
      .sec-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
      .sec-head .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

      /* ---------- 7. KPI cards: label · hero number · delta chip · sparkline ---------- */
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px, 1fr)); gap: 12px; }
      .card {
        position: relative; overflow: hidden; background: linear-gradient(180deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 15px 16px 12px;
        transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms);
      }
      .card::after { /* a hairline of light along the top edge of the surface */
        content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .07), transparent);
      }
      .card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-1); }
      .card .k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); font-weight: 700;
        display: flex; align-items: center; gap: 6px; }
      .card .k .hint-dot { width: 12px; height: 12px; border-radius: 999px; border: 1px solid var(--line-strong);
        display: grid; place-items: center; font-size: 8px; color: var(--ink-4); cursor: help; }
      .card .row { display: flex; align-items: flex-end; gap: 8px; margin-top: 7px; }
      .card .v { font-size: 33px; font-weight: 600; letter-spacing: -1.1px; line-height: 1.05;
        font-variant-numeric: tabular-nums; }
      .card .h { font-size: 11.5px; color: var(--ink-4); margin-top: 4px; }
      .card .spark { height: 30px; margin: 6px -4px -4px; }
      .card .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .card .spark .spark-line { stroke-dasharray: 1; animation: draw .9s var(--ease) both; animation-delay: 120ms; }
      .card.good .v { color: var(--accent); }
      .card.bad .v { color: var(--loss); }
      .card.hot { border-color: color-mix(in oklab, var(--accent) 30%, var(--line-soft)); }
      .card.hot::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 160px; height: 160px;
        background: radial-gradient(circle, var(--accent-glow), transparent 65%); opacity: .55; pointer-events: none; }

      /* Delta chips: signed change with the good/bad colouring of the metric. */
      .delta-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
        padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums;
        border: 1px solid var(--line-soft); background: var(--panel-3); color: var(--ink-3); }
      .delta-chip.up { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 35%, transparent);
        background: color-mix(in oklab, var(--accent) 12%, transparent); }
      .delta-chip.down { color: var(--loss); border-color: color-mix(in oklab, var(--loss) 35%, transparent);
        background: color-mix(in oklab, var(--loss) 12%, transparent); }

      /* ---------- 8. panels ---------- */
      .panel {
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 17px 18px 18px;
        animation: rise .5s var(--ease) both;
      }
      .panel > h3 { display: flex; align-items: center; gap: 8px; }
      .panel > h3::before { content: ""; width: 3px; height: 13px; border-radius: 999px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong)); }
      .sub { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }
      .note { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); background: var(--panel-3);
        border: 1px solid var(--line-soft); border-left: 2px solid var(--dq-inacc); border-radius: var(--radius-sm);
        padding: 9px 12px; }
      .empty { padding: 34px 20px; text-align: center; color: var(--ink-3); font-size: 13px;
        background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px dashed var(--line);
        border-radius: var(--radius); }

      /* ---------- 9. bars, splits, momentum ---------- */
      .bar { height: 8px; border-radius: 999px; background: var(--panel-3); overflow: hidden;
        box-shadow: 0 0 0 1px var(--line-soft) inset; }
      .bar > i { display: block; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, var(--accent-strong), var(--accent)); animation: grow .7s var(--ease) both; }
      .split { margin-top: 14px; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
      .split-head, .split-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-4); }
      .split-head { margin-bottom: 6px; }
      .split-name { font-weight: 600; color: var(--ink); font-size: 13px; }
      .split-foot { margin-top: 5px; font-variant-numeric: tabular-nums; }
      .split .bar { cursor: help; }
      .phase { display: grid; grid-template-columns: 110px 1fr 54px; align-items: center; gap: 12px; padding: 5px 0; }
      .phase .name { font-size: 12.5px; color: var(--ink-2); }
      .phase .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      .phase.weak .bar > i { background: linear-gradient(90deg, var(--loss), color-mix(in oklab, var(--loss) 60%, var(--accent))); }

      .mom-row { display: grid; grid-template-columns: 96px 64px 76px 1fr; align-items: center; gap: 10px; padding: 6px 0; }
      .mom-name { font-size: 12.5px; color: var(--ink-3); }
      .mom-val { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
      .delta { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .delta.up { color: var(--accent); } .delta.down { color: var(--loss); } .delta.flat { color: var(--ink-4); }
      .mom-bars { display: flex; align-items: flex-end; gap: 4px; height: 28px; }
      .mom-bars > i { width: 15px; border-radius: 4px 4px 2px 2px; background: var(--panel-3); animation: growUp .6s var(--ease) both; }
      .mom-bars > i.prev { background: color-mix(in oklab, var(--accent) 24%, var(--panel-3)); }
      .mom-bars > i.rec { background: linear-gradient(180deg, var(--accent), var(--accent-strong)); }
      .mom-legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-4); margin-top: 8px; }

      /* ---------- 10. donut + distribution ---------- */
      .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
      .donut { position: relative; width: 148px; height: 148px; flex: none; }
      .donut svg { transform: rotate(-90deg); }
      .donut circle { fill: none; stroke-width: 11; stroke-linecap: round; }
      .donut .track { stroke: var(--panel-3); }
      /* Each segment draws itself in: the ring starts hidden (offset shifted by its own length) and
         settles on the offset the slice needs. */
      .donut .seg { animation: dash 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms); }
      .donut .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
      .donut .centre b { font-size: 27px; font-weight: 600; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
      .donut .centre span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); font-weight: 700; }
      .legend { display: grid; gap: 7px; min-width: 190px; max-width: 440px; flex: 1; }
      .legend-row { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 9px; font-size: 12.5px; }
      .swatch { width: 10px; height: 10px; border-radius: 3px; }
      .legend-row .lbl { color: var(--ink-2); }
      .legend-row .n { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
      .legend-row .pct { color: var(--ink-4); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

      .dist { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--panel-3);
        box-shadow: 0 0 0 1px var(--line-soft) inset; }
      .dist-seg { height: 100%; animation: growx .8s var(--ease) both; transition: filter .15s var(--ease); }
      .dist-seg:hover { filter: brightness(1.25); }
      .dist-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; }

      /* ---------- 11. quality list (percentages with counts) ---------- */
      .quality { display: grid; gap: 7px; margin-top: 14px; }
      .q-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px 64px; align-items: center; gap: 10px;
        animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 26ms); }
      .q-name { font-size: 12.5px; color: var(--ink-2); }
      .q-bar { height: 7px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
      .q-bar > i { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--accent));
        animation: grow .6s var(--ease) both; }
      .q-pct { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
      .q-n { font-size: 11.5px; color: var(--ink-4); text-align: right; font-variant-numeric: tabular-nums; }

      /* ---------- 12. histogram ---------- */
      .hist { display: flex; align-items: flex-end; gap: 7px; margin-top: 12px; }
      .hist-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: help; }
      .hist-bar { width: 100%; height: 108px; display: flex; align-items: flex-end; background: var(--panel-3);
        border-radius: 7px; overflow: hidden; box-shadow: 0 0 0 1px var(--line-soft) inset;
        transition: box-shadow var(--dur) var(--ease); }
      .hist-bar > i { display: block; width: 100%; border-radius: 7px;
        background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 92%, #fff 6%), var(--accent-strong));
        animation: growUp .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); transition: filter .15s var(--ease); }
      .hist-col:hover .hist-bar { box-shadow: 0 0 0 1px var(--line-strong) inset; }
      .hist-col:hover .hist-bar > i { filter: brightness(1.16); }
      .hist-n { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      .hist-ax { font-size: 10px; color: var(--ink-4); }

      /* ---------- 13. decision quality (you vs opponent) ---------- */
      .dec-head, .dec { display: grid; grid-template-columns: 92px 1fr 34px 1fr 34px; align-items: center; gap: 8px; }
      .dec-head { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); font-weight: 700;
        margin: 10px 0 4px; }
      .dec { padding: 3px 0; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 26ms); }
      .dec-name { font-size: 12.5px; color: var(--ink-2); }
      .dec-bar { height: 9px; border-radius: 999px; background: var(--panel-3); overflow: hidden;
        box-shadow: 0 0 0 1px var(--line-soft) inset; }
      .dec-bar > i { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--accent));
        animation: grow .6s var(--ease) both; }
      .dec-bar.opp > i { opacity: .38; }
      .dec-n { font-size: 12px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      .dec-n.opp { color: var(--ink-4); }

      /* ---------- 14. charts ---------- */
      .chart { display: block; width: 100%; height: 190px; overflow: visible; }
      .grid-line { stroke: var(--line-soft); stroke-width: 1; }
      .chart .chart-line { stroke-dasharray: 1; animation: draw 1.1s var(--ease) both;
        filter: drop-shadow(0 6px 14px color-mix(in oklab, var(--accent) 22%, transparent)); }
      .chart .chart-raw { animation: fadeIn .9s var(--ease) .25s both; }
      .chart .chart-dot { fill: var(--accent); stroke: var(--panel-2); stroke-width: 1; opacity: 0;
        animation: pop .35s var(--ease) .55s both; }
      .chart-hit { fill: transparent; cursor: pointer; }
      .chart-hit:hover + .chart-dot { fill: var(--ink); stroke: var(--accent); stroke-width: 1.6; }
      .chart-empty { padding: 30px 0; text-align: center; color: var(--ink-4); font-size: 12.5px; }

      /* ---------- 15. tables ---------- */
      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      thead th { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4);
        font-weight: 700; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
      thead th:first-child { text-align: left; }
      tbody td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); text-align: right; font-size: 13px; }
      tbody td:first-child { text-align: left; }
      tbody tr { transition: background-color 140ms var(--ease); }
      tbody tr:hover { background: var(--panel-2); }
      tbody tr[onclick]:not(.none) { cursor: pointer; }
      th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
      th.sortable:hover { color: var(--ink-2); }
      th .caret { margin-left: 4px; font-size: 9px; opacity: .35; }
      th.active { color: var(--ink); }
      th.active .caret { opacity: 1; color: var(--accent); }
      td.act { text-align: right; white-space: nowrap; }
      tr.warn-row td:first-child { box-shadow: inset 2px 0 0 var(--loss); }
      .op-name { font-weight: 600; color: var(--ink); }
      .op-eco { margin-left: 8px; font-size: 11px; color: var(--ink-4); letter-spacing: .04em; }
      .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
        background: var(--panel-3); border: 1px solid var(--line-soft); }
      .pill.low { color: var(--loss); border-color: color-mix(in oklab, var(--loss) 30%, transparent);
        background: color-mix(in oklab, var(--loss) 10%, transparent); }
      .bests td.big { font-weight: 700; font-size: 15px; color: var(--accent); }
      .bests td.hint { color: var(--ink-4); font-size: 12px; }
      .bests tbody tr.none { cursor: default; }
      .bests tbody tr.none:hover { background: none; }

      /* ---------- 15b. controls (Data tab) ---------- */
      .btn {
        font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer;
        color: var(--accent-ink); border: 1px solid transparent;
        background: linear-gradient(160deg, color-mix(in oklab, var(--accent) 92%, #fff 3%), var(--accent-strong));
        transition: filter var(--dur) var(--ease), transform 120ms var(--ease);
      }
      .btn:hover { filter: brightness(1.07); }
      .btn:active { transform: translateY(1px); }
      .btn.ghost { color: var(--ink-2); background: var(--panel-2); border-color: var(--line); }
      .btn.ghost:hover { color: var(--ink); border-color: var(--line-strong); filter: none; }
      .btn:disabled, .btn.ghost:disabled { opacity: .45; cursor: default; filter: none; }
      .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
      .check { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); margin-top: 10px; cursor: pointer; }
      .check input[type="checkbox"] {
        appearance: none; width: 17px; height: 17px; border-radius: 5px; cursor: pointer; position: relative;
        border: 1px solid var(--line-strong); background: var(--panel-3);
        transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
      }
      .check input[type="checkbox"]:checked { background: var(--accent); border-color: transparent; }
      .check input[type="checkbox"]:checked::after {
        content: ""; position: absolute; left: 5px; top: 1.5px; width: 4px; height: 9px;
        border: 2px solid var(--accent-ink); border-top: 0; border-left: 0; transform: rotate(42deg);
      }
      input[type="file"] { color: var(--ink-3); font-size: 12.5px; max-width: 100%; }
      .split-games { color: var(--ink-4); font-variant-numeric: tabular-nums; }

      /* ---------- 15d. interactive cards, evidence panel, daily tracker ---------- */
      /* A card with a metric is a button: it opens the panel explaining how its number was counted. */
      .card.clickable { cursor: pointer; }
      .card.clickable:focus-visible { box-shadow: var(--ring); }
      .card.clickable:hover .v { color: var(--ink); }
      .card.open {
        border-color: color-mix(in oklab, var(--accent) 45%, var(--line-soft));
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 22%, transparent), var(--shadow-1);
      }
      .card.open::after { background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 55%, transparent), transparent); }

      .inspect { display: grid; gap: 10px; }
      .inspect-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .inspect-stats { display: flex; flex-wrap: wrap; gap: 6px; }
      .stat-chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
        color: var(--ink-2); background: var(--panel-3); border: 1px solid var(--line-soft);
        font-variant-numeric: tabular-nums; }
      .btn.sm { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
      .contrib { margin-top: 2px; }
      .contrib td.act { text-align: right; white-space: nowrap; }
      .contrib td.big { font-weight: 600; color: var(--ink); }
      .contrib tbody tr { cursor: pointer; }
      .linkbtn {
        font: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 8px; cursor: pointer;
        color: var(--ink-2); background: var(--panel-3); border: 1px solid var(--line-soft);
        transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
      }
      .linkbtn:hover { color: var(--ink); border-color: var(--line-strong); }

      /* Twelve weeks of days as columns of weeks; each cell is a button that scopes the page. */
      .days { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 4px;
        overflow-x: auto; padding: 2px 0 6px; }
      .day {
        width: 14px; height: 14px; padding: 0; border-radius: 3px; background: var(--panel-3);
        border: 1px solid var(--line-soft); cursor: pointer;
        transition: transform 120ms var(--ease), border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
      }
      .day:hover { transform: scale(1.25); border-color: var(--line-strong); }
      .day[data-level="1"] { background: color-mix(in oklab, var(--accent) 24%, var(--panel-3)); }
      .day[data-level="2"] { background: color-mix(in oklab, var(--accent) 46%, var(--panel-3)); }
      .day[data-level="3"] { background: color-mix(in oklab, var(--accent) 70%, var(--panel-3)); }
      .day[data-level="4"] { background: var(--accent); }
      .day.on { outline: 2px solid var(--ink); outline-offset: 1px; }
      .day.empty { visibility: hidden; cursor: default; }
      .day-legend { display: inline-flex; align-items: center; gap: 4px; }
      .day-legend .day { cursor: default; }
      .day-legend .day:hover { transform: none; }
      .day-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        margin-top: 6px; font-size: 11.5px; color: var(--ink-4); }

      /* ---------- 15e. coaching, head to head, master game table ---------- */
      /* A head-to-head row is a button: click it to scope the page to that opponent. */
      .split.clickable { cursor: pointer; padding: 6px 8px; margin-left: -8px; border-radius: 8px;
        transition: background-color 140ms var(--ease); }
      .split.clickable:hover { background: var(--panel-2); }
      .split.clickable:hover .split-name { color: var(--ink); }

      /* One ranked finding per row, with the link that goes to it. */
      .focus-list { display: grid; gap: 8px; margin-top: 12px; }
      .focus-row {
        display: grid; grid-template-columns: 1fr auto; grid-template-areas: "title go" "detail go";
        gap: 2px 14px; align-items: center; padding: 11px 13px; border-radius: 10px;
        background: var(--panel-3); border: 1px solid var(--line-soft);
        border-left: 2px solid color-mix(in oklab, var(--accent) 55%, transparent);
        animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms);
      }
      .focus-title { grid-area: title; font-weight: 600; font-size: 13px; color: var(--ink); }
      .focus-detail { grid-area: detail; font-size: 12.5px; color: var(--ink-3); }
      .focus-go { grid-area: go; white-space: nowrap; }

      /* The master game table: the same numbers as the cards, one row per game. */
      .games tbody td { font-size: 12.5px; }

      /* ---------- 16. tooltip ---------- */
      #tip { position: fixed; z-index: 60; pointer-events: none; display: grid; gap: 2px;
        padding: 9px 11px; border-radius: 11px; background: var(--panel-4); border: 1px solid var(--line-strong);
        box-shadow: var(--shadow-2); font-size: 12px; color: var(--ink-3);
        opacity: 0; transform: translateY(4px); transition: opacity 120ms var(--ease), transform 120ms var(--ease); }
      #tip.show { opacity: 1; transform: none; }
      #tip b { color: var(--ink); font-size: 13.5px; letter-spacing: -.2px; }
      .tip-res.win { color: var(--accent); } .tip-res.loss { color: var(--loss); }

      /* ---------- 17. loading skeleton, foot ---------- */
      .skeleton { display: grid; gap: 12px; }
      .sk-card { height: 104px; border-radius: var(--radius); border: 1px solid var(--line-soft);
        background: linear-gradient(100deg, var(--panel) 30%, var(--panel-3) 50%, var(--panel) 70%);
        background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
      .sk-row { height: 168px; border-radius: var(--radius); border: 1px solid var(--line-soft);
        background: linear-gradient(100deg, var(--panel) 30%, var(--panel-3) 50%, var(--panel) 70%);
        background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
      .foot { grid-column: 1 / -1; text-align: center; font-size: 11.5px; color: var(--ink-4);
        padding-top: 10px; border-top: 1px solid var(--line-soft); margin-top: 6px; }

      /* ---------- 18. motion ---------- */
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
      @keyframes grow { from { width: 0; } }
      @keyframes growx { from { width: 0; } }
      @keyframes growUp { from { height: 0; } }
      @keyframes draw { from { stroke-dashoffset: 1; } }
      @keyframes dash { from { stroke-dashoffset: var(--from, 0); } }
      @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
      @keyframes fadeIn { from { opacity: 0; } }
      @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

      /* ---------- 19. responsive ---------- */
      @media (max-width: 1080px) {
        .wrap { grid-template-columns: minmax(0, 1fr); }
        .jump { display: none; }
      }
      @media (max-width: 640px) {
        .top-in, .wrap { padding-left: 16px; padding-right: 16px; }
        .card .v { font-size: 28px; }
        .mom-row { grid-template-columns: 84px 56px 1fr; }
        .mom-bars { display: none; }
      }

      /* ---------- 20. print ---------- */
      @media print {
        body { background: #fff; color: #111; }
        .top, .toolbar, .jump { position: static; background: none; backdrop-filter: none; border: 0; }
        .panel, .card { background: none; border-color: #ddd; box-shadow: none; break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-in">
        <div class="brand">
          <div class="brand-mark"><img src="pieces-img/cburnett/wN.svg" alt="" /></div>
          <div class="brand-name">Chess <span>/ Review</span></div>
        </div>
        <nav class="tabs" aria-label="Reports">
          <button class="tab" id="tab-progress" data-tab="progress" aria-pressed="true">Progress</button>
          <button class="tab" id="tab-openings" data-tab="openings" aria-pressed="false">Openings</button>
          <button class="tab" id="tab-data" data-tab="data" aria-pressed="false">Data</button>
        </nav>
      </div>
    </header>

    <div class="wrap">
      <div class="main"><main id="view"></main></div>
      <nav class="jump" id="jump" aria-label="Jump to section"></nav>
      <div class="foot">Built from your local Library — nothing leaves this browser.</div>
    </div>
    <script type="module" src="progress.js"></script>
  </body>
</html>
