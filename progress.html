<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Review — Progress</title>
    <link rel="icon" type="image/png" sizes="128x128" href="icons/icon128.png" />
    <style>
      /* Chess Review — Progress page. Shares the analyzer's dark design system (same variables as
         popup.html) but is a standalone, engine-free page: it only reads the saved Library. */
      :root {
        --font-ui: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #14130f; --bg-grain: #1a1916; --panel: #1f1e1a; --panel-2: #262521; --panel-3: #2e2c27;
        --line: #34322c; --line-soft: #2a2823;
        --ink: #f3f1ea; --ink-2: #b8b4a8; --ink-3: #807c70;
        --accent: #7fb45f; --accent-strong: #6aa14a; --accent-ink: #11210a;
        --loss: #ef7a70; --draw: #b8b4a8;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font-family: var(--font-ui); min-height: 100vh; color: var(--ink); font-size: 14px;
        background: radial-gradient(120% 80% at 50% -10%, var(--bg-grain), var(--bg) 65%);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 20px 60px; }
      .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
        background: linear-gradient(160deg, var(--accent), var(--accent-strong)); }
      .brand-mark img { width: 22px; height: 22px; display: block; }
      .brand-name { font-weight: 800; letter-spacing: .14em; font-size: 13px; text-transform: uppercase; }
      .brand-name span { color: var(--ink-3); font-weight: 600; }
      .tabs { display: flex; gap: 6px; margin-left: auto; }
      .tab { font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 8px 16px;
        border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); }
      .tab:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
      .tab[aria-pressed="true"] { color: var(--accent-ink); background: linear-gradient(160deg, var(--accent), var(--accent-strong)); border-color: transparent; }

      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 14px 16px; }
      .card .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
      .card .v { font-size: 26px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
      .card .h { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
      .card.good .v { color: var(--accent); }

      .panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
      .panel h3 { margin: 0 0 4px; font-size: 14px; letter-spacing: .02em; }
      .panel .sub { margin: 0 0 12px; font-size: 12px; color: var(--ink-3); }
      .chart { width: 100%; height: 170px; display: block; }
      .chart-empty { color: var(--ink-3); font-size: 13px; padding: 40px 0; text-align: center; }
      .grid-line { stroke: var(--line-soft); stroke-width: 1; }
      .axis-label { fill: var(--ink-3); font-size: 10px; font-family: var(--font-ui); }

      table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
      th { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
      th:first-child, td:first-child { text-align: left; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: var(--panel-2); }
      .op-name { font-weight: 600; }
      .op-eco { color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }
      .warn-row { background: color-mix(in oklab, var(--loss) 12%, transparent); }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--panel-3); color: var(--ink-2); }
      .pill.low { background: color-mix(in oklab, var(--loss) 28%, var(--panel-3)); color: var(--ink); }
      .empty { text-align: center; color: var(--ink-3); padding: 60px 20px; line-height: 1.6; }
      .empty a { color: var(--accent); }
      .foot { margin-top: 26px; font-size: 12px; color: var(--ink-3); text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="brand">
          <div class="brand-mark"><img src="pieces-img/cburnett/wN.svg" alt="" /></div>
          <div class="brand-name">Chess <span>/ Review</span></div>
        </div>
        <div class="tabs">
          <button class="tab" id="tab-progress" data-tab="progress" aria-pressed="true">Progress</button>
          <button class="tab" id="tab-openings" data-tab="openings" aria-pressed="false">Openings</button>
        </div>
      </div>
      <div id="view"></div>
      <div class="foot">Built from your local Library — nothing leaves this browser.</div>
    </div>
    <script type="module" src="progress.js"></script>
  </body>
</html>
